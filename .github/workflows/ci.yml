name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Ci_Dev_Pass123!
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build --configuration Release
      - run: dotnet test tests/Sms.Tests.Unit --configuration Release
      - run: dotnet test tests/Sms.Tests.Integration --configuration Release
        env:
          SMS_TEST_PG_HOST: localhost
          SMS_TEST_PG_PASSWORD: "Ci_Dev_Pass123!"
