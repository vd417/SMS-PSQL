services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sms_dev
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: "Local_Dev_Pass123!"
    ports: ["5432:5432"]
    volumes:
      # postgres 18+ images keep data in a major-version subdirectory and refuse to start with a
      # mount at /var/lib/postgresql/data; the single mount must be /var/lib/postgresql.
      - db-data:/var/lib/postgresql
      # Files here run once, in name order, only against a brand-new (empty) data volume.
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sms", "-d", "sms_dev"]
      interval: 5s
      timeout: 5s
      retries: 30
  # One-shot: applies pending db/postgres/migrations on top of the baseline initdb created, as
  # the schema owner (the sms bootstrap superuser). The API only starts after it succeeds.
  migrate:
    build: { context: ., dockerfile: db/Sms.PgMigrator/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
    environment:
      SMS_MIGRATOR_CONNECTION: "Host=db;Port=5432;Database=sms_dev;Username=sms;Password=Local_Dev_Pass123!"
    command: ["migrate"]
  api:
    build: { context: ., dockerfile: src/Sms.Api/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      # The API connects as the non-superuser sms_app role (db/postgres/00_app_role.sql), never as the
      # "sms" bootstrap superuser above: a superuser bypasses every RLS policy.
      ConnectionStrings__Sql: "Host=db;Port=5432;Database=sms_dev;Username=sms_app;Password=sms_app_dev_pw"
      Jwt__SigningKey: "compose-dev-signing-key-at-least-32-bytes!!"
      ASPNETCORE_ENVIRONMENT: "Development"
      # DataProtection keys must survive `docker compose restart`/recreate or every school's
      # encrypted Razorpay secrets become permanently undecryptable — see dp-keys volume below.
      DataProtection__KeyPath: "/app/keys"
    ports: ["5080:8080"]
    volumes:
      - dp-keys:/app/keys

volumes:
  dp-keys: {}
  db-data: {}
