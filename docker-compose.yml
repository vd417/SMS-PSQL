services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sms_dev
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: "Local_Dev_Pass123!"
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      # Files here run once, in name order, only against a brand-new (empty) data volume.
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
  api:
    build: { context: ., dockerfile: src/Sms.Api/Dockerfile }
    depends_on: [db]
    environment:
      ConnectionStrings__Sql: "Host=db;Port=5432;Database=sms_dev;Username=sms;Password=Local_Dev_Pass123!"
      Jwt__SigningKey: "compose-dev-signing-key-at-least-32-bytes!!"
      ASPNETCORE_ENVIRONMENT: "Development"
      # DataProtection keys must survive `docker compose restart`/recreate or every school's
      # encrypted Razorpay secrets become permanently undecryptable — see dp-keys volume below.
      DataProtection__KeyPath: "/app/keys"
    ports: ["5080:8080"]
    volumes:
      - dp-keys:/app/keys

volumes:
  dp-keys: {}
  db-data: {}
